[package]
name = "tyra"
version = "1.0.0"
authors = ["sers.dev <admin@sers.dev>"]
edition = "2018"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sers-dev/tyra"
homepage = "https://github.com/sers-dev/tyra"
documentation = "https://docs.rs/tyra"
description = "Typed Actor System"
keywords = ["typed", "actor", "scaling", "concurrency", "tyra"]
categories = ["network-programming", "asynchronous", "concurrency"]
exclude = ["/.github", ".gitignore"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "tyra"
path = "src/lib.rs"

[dependencies]
config = "0.15.18"
hostname = "0.4.1"
num_cpus = "1.17.0"
threadpool = "1.8.1"
crossbeam-channel = "0.5.15"
flume = "0.11.1"
dashmap = "6.1.0"
serde = { version = "1.0.213", features = ["derive"] }
serde-encrypt = "0.7.0"
thiserror = "1.0.65"
log = "0.4.22"
ctrlc = { version = "3.4.5", features = ["termination"] }
mio = {version = "1.0.2", features = ["os-poll", "os-ext", "net"]}
quiche = "0.22.0"
io-arc = "1.0.0"
hashring = "0.3.6"
bincode = "1.3.3"
regex = "1.11.0"
trust-dns-resolver = "0.23.2"


[dev-dependencies]
ntest = "0.9.3"
simple_logger = "5.0.0"